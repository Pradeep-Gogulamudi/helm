{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "base-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "10m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "externalSecret.storeName is required when externalSecret.enabled=true" .Values.externalSecret.storeName }}
  target:
    name: {{ .Values.externalSecret.targetSecret | default (include "base-service.fullname" .) }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "base-service.labels" . | nindent 10 }}
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
        {{- if .remoteRef.version }}
        version: {{ .remoteRef.version }}
        {{- end }}
    {{- end }}
{{- end }}
