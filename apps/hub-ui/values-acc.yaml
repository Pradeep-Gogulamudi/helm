      - secretKey: SALSIFY_SANDBOX_API_ORG_ID
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: SALSIFY_SANDBOX_API_ORG_ID
      - secretKey: SALSIFY_API_ORG_ID
        remoteRef:
