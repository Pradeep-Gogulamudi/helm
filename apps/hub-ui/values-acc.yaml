      # Gemini / Vertex AI
      - secretKey: GEMINI_VERTAX_AI_TOKEN
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: GEMINI_VERTAX_AI_TOKEN
      # Google Cloud
      - secretKey: GOOGLE_CLOUD_PROJECT
        remoteRef:
