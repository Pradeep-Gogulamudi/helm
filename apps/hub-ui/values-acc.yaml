app-template:
  image:
    tag: acc

  gateway:
    gatewayName: product-content-gateway-acc
    gatewayNamespace: ingress-gateway
    hostnames:
      - ai-hub-acc.company.com

  externalSecret:
    enabled: true
    storeName: gcp-cluster-secret-store
    refreshInterval: "5m"
    data:
      # MongoDB
      - secretKey: MONGO_DB_URI
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: MONGO_DB_URI
      - secretKey: MONGO_DB_NAME
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: MONGO_DB_NAME
      # JWT
      - secretKey: SECURITY_JWT_TOKEN_ISSUER
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: SECURITY_JWT_TOKEN_ISSUER
      - secretKey: SECURITY_JWT_TOKEN_SIGNING_KEY
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: SECURITY_JWT_TOKEN_SIGNING_KEY
      - secretKey: SECURITY_JWT_TOKEN_EXPIRATION_HOURS
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: SECURITY_JWT_TOKEN_EXPIRATION_HOURS
      # CORS
      - secretKey: SECURITY_CORS_ALLOWED_ORIGINS
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: SECURITY_CORS_ALLOWED_ORIGINS
      # Azure Blob Storage
      - secretKey: AZURE_STORAGE_TRANSLATIONS_CONNECTION_URL
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: AZURE_STORAGE_TRANSLATIONS_CONNECTION_URL
      - secretKey: AZURE_STORAGE_TRANSLATIONS_CONTAINER_NAME
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: AZURE_STORAGE_TRANSLATIONS_CONTAINER_NAME
      - secretKey: AZURE_STORAGE_TRANSLATIONS_URL_EXPIRATION_DAYS
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: AZURE_STORAGE_TRANSLATIONS_URL_EXPIRATION_DAYS
      # Kafka
      - secretKey: KAFKA_HOST
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: KAFKA_HOST
      - secretKey: KAFKA_PORT
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: KAFKA_PORT
      - secretKey: KAFKA_GROUP
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: KAFKA_GROUP
      - secretKey: KAFKA_USERNAME
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: KAFKA_USERNAME
      - secretKey: KAFKA_PASSWORD
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub-key/versions/latest
      - secretKey: KAFKA_REDELIVERY_MAX
        remoteRef:
          key: projects/vdxl-acc-product-content-01/secrets/ai-hub/versions/latest
          property: KAFKA_REDELIVERY_MAX
      - secretKey: KAFKA_REDELIVERY_DELAY
        remoteRef:
